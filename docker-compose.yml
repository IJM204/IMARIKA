version: '3.8'

services:
  agriburundi-api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_BASE_URL=http://localhost:11434
      - OLLAMA_MODEL=qwen3:1.7b
      - HOST=0.0.0.0
      - PORT=8000
      - APP_ENV=production
    volumes:
      - ./data:/app/data
    network_mode: host
    restart: unless-stopped
    container_name: agriburundi-api
