[pytest]
; Suite de tests AGRIBurundi-AI / Imarika (MVP FastAPI)
; Les tests legacy (Streamlit/LangGraph/llama3) sont exclues par defaut via -m.
testpaths = tests
python_files = test_*.py
python_functions = test_*
markers =
    fast: test rapide, aucun appel a Ollama
    ollama: test d'integration avec generation reelle (qwen3:1.7b), lent sur CPU
    e2e: test de bout en bout Frontend -> FastAPI -> Knowledge -> Ollama -> SQLite
    legacy: ancienne architecture (Streamlit/LangGraph/llama3) — obsolète, exclu par defaut
addopts = -m "not legacy" -ra
